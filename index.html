    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; }

        /* 卡包質感漸層與光澤 */
        .booster-pack {
            background: linear-gradient(135deg, #b45309 0%, #d97706 40%, #78350f 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .booster-pack:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(245,158,11,0.35), inset 0 2px 6px rgba(255,255,255,0.6);
        }

        /* 撕卡包上下裂開動畫 */
        @keyframes tearTop {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120px) rotate(-8deg); opacity: 0; }
        }
        @keyframes tearBottom {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(120px) rotate(8deg); opacity: 0; }
        }
        .anim-tear-top { animation: tearTop 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .anim-tear-bottom { animation: tearBottom 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        /* 卡片彈出動畫 */
        @keyframes cardPop {
            0% { transform: scale(0.5) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .anim-card-pop { animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* SSR 金色炫光邊框 */
        .ssr-card {
            border: 2px solid #fbbf24;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        }
        .sr-card {
            border: 2px solid #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>

            { id: 39, name: "宜蘭蔥油餅", emoji: "🥠", region: "礁溪名物", rarity: "N", desc: "滿滿三星蔥加上半熟蛋煎到金黃酥脆。" },
            { id: 40, name: "花蓮扁食", emoji: "🥟", region: "花蓮市", rarity: "N", desc: "皮薄肉鮮的傳統大扁食，湯頭清甜順口。" }
        ];

        let gameState = {
            packs: 3,
            collected: {}, // { id: count }
            lastClaimDate: null
        };

        function loadGame() {
            const saved = localStorage.getItem('taiwan_tcg_save');
            if (saved) {
                try { gameState = JSON.parse(saved); } catch(e) {}
            }
            updateUI();
        }

        function saveGame() {
            localStorage.setItem('taiwan_tcg_save', JSON.stringify(gameState));
            updateUI();
        }

        function updateUI() {
            document.getElementById('pack-count').textContent = gameState.packs;
            const collectedCount = Object.keys(gameState.collected).length;
            document.getElementById('progress-text').textContent = `${collectedCount} / ${allSnacks.length}`;
            renderEncyclopedia();
        }

        function switchTab(tab) {
            const isPack = tab === 'pack';
            document.getElementById('section-pack').classList.toggle('hidden', !isPack);
            document.getElementById('section-collection').classList.toggle('hidden', isPack);
            document.getElementById('section-collection').classList.toggle('flex', !isPack);
            
            document.getElementById('tab-pack').className = isPack 
                ? "py-3.5 text-amber-400 border-b-2 border-amber-400 transition" 
                : "py-3.5 text-slate-400 hover:text-slate-200 transition";
            document.getElementById('tab-collection').className = !isPack 
                ? "py-3.5 text-amber-400 border-b-2 border-amber-400 transition" 
                : "py-3.5 text-slate-400 hover:text-slate-200 transition";
        }

        function claimFreePacks() {
            const today = new Date().toDateString();
            if (gameState.lastClaimDate === today) {
                showToast("今天已經領過卡包囉！明天請再來～");
                return;
            }
            gameState.lastClaimDate = today;
            gameState.packs += 2;
            saveGame();
            showToast("成功領取 +2 卡包！");
        }

        function drawOneSnack() {
            const rand = Math.random();
            let pool = [];
            if (rand < 0.08) {
                pool = allSnacks.filter(s => s.rarity === 'SSR');
            } else if (rand < 0.28) {
                pool = allSnacks.filter(s => s.rarity === 'SR');
            } else if (rand < 0.58) {
                pool = allSnacks.filter(s => s.rarity === 'R');
            } else {
                pool = allSnacks.filter(s => s.rarity === 'N');
            }
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function tearPackAnimation() {
            if (gameState.packs < 1) {
                showToast("卡包不足！請點擊「每日免費 +2 卡包」。");
                return;
            }

            const packContainer = document.getElementById('pack-container');
            const tearBtn = document.getElementById('tear-btn');
            
            // 模擬撕開動效
            packContainer.style.transition = "transform 0.3s";
            packContainer.style.transform = "scale(0.95)";
            
            setTimeout(() => {
                gameState.packs -= 1;
                const pulled = [];
                for (let i = 0; i < 5; i++) {
                    const snack = drawOneSnack();
                    pulled.push(snack);
                    gameState.collected[snack.id] = (gameState.collected[snack.id] || 0) + 1;
                }
                saveGame();

                packContainer.classList.add('hidden');
                tearBtn.classList.add('hidden');

                const stage = document.getElementById('cards-stage');
                stage.classList.remove('hidden');

                const grid = document.getElementById('pulled-cards-grid');
                grid.innerHTML = pulled.map((snack, idx) => `
                    <div onclick="showSnackDetail(${snack.id})" style="animation-delay: ${idx * 0.08}s" class="anim-card-pop cursor-pointer bg-slate-800 rounded-xl p-3 flex flex-col justify-between text-center transition hover:-translate-y-1 ${
                        snack.rarity === 'SSR' ? 'ssr-card' : snack.rarity === 'SR' ? 'sr-card' : 'border border-slate-700'
                    }">
                        <div>
                            <span class="inline-block text-[9px] font-bold px-2 py-0.5 rounded-full mb-1.5 ${
                                snack.rarity === 'SSR' ? 'bg-amber-500 text-slate-950' :
                                snack.rarity === 'SR' ? 'bg-purple-600 text-white' :
                                snack.rarity === 'R' ? 'bg-blue-600 text-white' : 'bg-slate-600 text-white'
                            }">${snack.rarity}</span>
                            <div class="text-3xl my-2">${snack.emoji}</div>
                            <h4 class="font-bold text-xs text-white leading-snug">${snack.name}</h4>
                            <p class="text-[9px] text-amber-400 mt-1">${snack.region}</p>
                        </div>
                        <div class="mt-3 text-[10px] text-slate-400 bg-slate-900/80 py-1 rounded">
                            點擊查看
                        </div>
                    </div>
                `).join('');

                showToast("🎉 卡包撕開成功！獲得 5 張台灣小吃卡片！");
            }, 300);
        }

        function resetPackStage() {
            document.getElementById('pack-container').classList.remove('hidden');
            document.getElementById('pack-container').style.transform = "scale(1)";
            document.getElementById('cards-stage').classList.add('hidden');
            document.getElementById('tear-btn').classList.remove('hidden');
        }

        function renderEncyclopedia() {
            const grid = document.getElementById('encyclopedia-grid');
            grid.innerHTML = allSnacks.map(snack => {
                const count = gameState.collected[snack.id] || 0;
                const isUnlocked = count > 0;
                return `
                    <div onclick="showSnackDetail(${snack.id})" class="border rounded-xl p-2.5 flex flex-col justify-between text-xs cursor-pointer transition hover:scale-[1.02] ${
                        isUnlocked 
                            ? (snack.rarity === 'SSR' ? 'bg-amber-950/40 ssr-card' : snack.rarity === 'SR' ? 'bg-purple-950/40 sr-card' : 'bg-slate-800/80 border-slate-600')
                            : 'bg-slate-950/60 border-slate-800 text-slate-600'
                    }">
                        <div class="flex justify-between items-start">
                            <span class="text-xl">${isUnlocked ? snack.emoji : '❓'}</span>
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${
                                snack.rarity === 'SSR' ? 'bg-amber-500 text-slate-950' :
                                snack.rarity === 'SR' ? 'bg-purple-600 text-white' :
                                snack.rarity === 'R' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'
                            }">${snack.rarity}</span>
                        </div>
                        <div class="mt-2">
                            <div class="flex justify-between items-center">
                                <p class="font-bold text-white text-[11px] truncate">${isUnlocked ? snack.name : '未解鎖小吃'}</p>
                                ${count > 1 ? `<span class="text-[9px] bg-amber-500 text-slate-950 px-1.5 rounded-full font-bold ml-1">x${count}</span>` : ''}
                            </div>
                            <p class="text-[9px] text-slate-400 mt-0.5 truncate">${isUnlocked ? snack.region : '???卡包抽出'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showSnackDetail(id) {
            const snack = allSnacks.find(s => s.id === id);
            const count = gameState.collected[id] || 0;
            const modal = document.getElementById('detail-modal');

            const rarityEl = document.getElementById('modal-rarity');
            rarityEl.textContent = `${snack.rarity} 級台灣美食卡`;
            rarityEl.className = `inline-block text-xs font-bold px-3 py-1 rounded-full ${
                snack.rarity === 'SSR' ? 'bg-amber-500 text-slate-950' :
                snack.rarity === 'SR' ? 'bg-purple-600 text-white' :
                snack.rarity === 'R' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-200'
            }`;

            document.getElementById('modal-emoji').textContent = count > 0 ? snack.emoji : '❓';
            document.getElementById('modal-name').textContent = count > 0 ? snack.name : '尚未解鎖的神秘小吃';
            document.getElementById('modal-region').textContent = count > 0 ? `📍 ${snack.region}` : '未知產地';
            document.getElementById('modal-desc').textContent = count > 0 ? snack.desc : '請透過撕開台灣小吃卡包來解鎖這張卡片！';
            document.getElementById('modal-count').textContent = count > 0 ? `圖鑑擁有張數：共 ${count} 張` : '圖鑑未收錄';

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function resetGameData() {
            if (confirm("確定要重置所有卡包與圖鑑進度嗎？")) {
                localStorage.removeItem('taiwan_tcg_save');
                gameState = { packs: 3, collected: {}, lastDailyDate: null };
                resetPackStage();
                updateUI();
                showToast("已重置所有圖鑑資料！");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        loadGame();
    </script>
